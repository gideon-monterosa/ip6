spring.application.name=meeting

# Import secrets
spring.config.import=optional:file:./secrets.properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/meetingdb
spring.datasource.username=${DB_USER:meetinguser}
spring.datasource.password=${DB_PASSWORD:meetingpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Server Configuration
server.port=8080

# CORS Configuration (for development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,flyway

# Google Calendar Config
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:4200/calendar-callback}

# Google Free/Busy Config
google.free.busy.client.id=${GOOGLE_FREE_BUSY_CLIENT_ID:}
google.free.busy.client.secret=${GOOGLE_FREE_BUSY_CLIENT_SECRET:}

# Microsoft Calendar Config
microsoft.client.id=${MICROSOFT_CLIENT_ID:}
microsoft.client.secret=${MICROSOFT_CLIENT_SECRET:}
microsoft.redirect.uri=${MICROSOFT_REDIRECT_URI:http://localhost:4200/calendar-callback}

# Ollama Config
ollama.url=${OLLAMA_URL:http://host.docker.internal:11434}
ollama.model=${OLLAMA_MODEL:llama3.1:8b}

# Firebase Notifications
firebase.config.path=firebase.json

