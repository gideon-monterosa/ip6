spring.application.name=meeting

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/meetingdb
spring.datasource.username=meetinguser
spring.datasource.password=meetingpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Server Configuration
server.port=8080

# CORS Configuration (for development)
cors.allowed-origins=http://localhost:4200

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,flyway
