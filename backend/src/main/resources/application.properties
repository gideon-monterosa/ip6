spring.application.name=meeting

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/meetingdb
spring.datasource.username=meetinguser
spring.datasource.password=meetingpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANT: Defer JPA initialization until after Flyway runs
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Ensure Flyway runs before Hibernate validation
spring.flyway.init-sqls-on-connect=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Server Configuration
server.port=8080

# CORS Configuration (for development)
cors.allowed-origins=http://localhost:4200
