<app-auth-layout>
  <div class="flex flex-col items-center mb-8">
    <img src="img/logo.png" alt="Meetings Logo" class="h-16 w-auto mb-4 drop-shadow-sm">
    <h2 class="text-3xl font-bold text-center text-foreground tracking-tight">Register</h2>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="space-y-4 mb-6">
      <app-input
        label="Username"
        type="text"
        id="username"
        formControlName="username"
        [control]="registerForm.get('username')!"
        [required]="true"
        placeholder="Choose a username"
      />

      <app-input
        label="Email"
        type="email"
        id="email"
        formControlName="email"
        [control]="registerForm.get('email')!"
        [required]="true"
        placeholder="example@domain.com"
      />

      <app-input
        label="Password"
        type="password"
        id="password"
        formControlName="password"
        [control]="registerForm.get('password')!"
        [required]="true"
        placeholder="Choose a secure password"
      />
    </div>

    @if (error) {
      <div class="text-destructive text-sm mb-6 p-3 bg-destructive/10 border border-destructive/20 rounded-lg flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
    }

    <app-button
      type="submit"
      variant="primary"
      [disabled]="registerForm.invalid"
      [loading]="loading"
      [fullWidth]="true"
    >
      {{ loading ? 'Registering...' : 'Create account' }}
    </app-button>
  </form>

  <div class="text-center mt-8 pt-6 border-t border-border text-sm text-muted-foreground">
    Already have an account?
    <a routerLink="/login" class="text-primary hover:text-primary-hover font-semibold transition-colors">
      Login here
    </a>
  </div>
</app-auth-layout>
