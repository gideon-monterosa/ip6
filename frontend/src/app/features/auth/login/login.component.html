<app-auth-layout>
  <h2 class="text-2xl font-bold text-center mb-6 text-foreground">Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <app-input
        label="Username"
        type="text"
        id="username"
        formControlName="username"
        [control]="loginForm.get('username')!"
        [required]="true"
      />
    </div>

    <div class="mb-4">
      <app-input
        label="Password"
        type="password"
        id="password"
        formControlName="password"
        [control]="loginForm.get('password')!"
        [required]="true"
      />
    </div>

    @if (error) {
      <div class="text-destructive text-sm mb-4 p-3 bg-destructive/10 border border-destructive/20 rounded-lg">
        {{ error }}
      </div>
    }

    <app-button
      type="submit"
      variant="primary"
      [disabled]="loginForm.invalid"
      [loading]="loading"
      [fullWidth]="true"
    >
      {{ loading ? 'Logging in...' : 'Login' }}
    </app-button>
  </form>

  <div class="text-center mt-6 text-sm text-muted-foreground">
    Don't have an account?
    <a routerLink="/register" class="text-primary hover:text-primary-hover font-medium transition-colors">
      Register here
    </a>
  </div>
</app-auth-layout>
