<header class="sticky top-0 z-50 bg-white border-b border-gray-200">
  <nav class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
    <a class="text-xl font-semibold text-gray-800" href="#">Meetings</a>
    @if (currentUser) {
      <div class="flex items-center gap-x-4">
        <a routerLink="/settings" class="text-sm font-medium text-gray-600 hover:text-blue-600">Settings</a>
        <span class="text-sm text-gray-600">{{ currentUser.username }}</span>
        <button
          type="button"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-500 hover:border-indigo-600 hover:text-indigo-600 focus:outline-none focus:border-indigo-600 focus:text-indigo-600 transition"
          (click)="logout()"
        >
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    }
  </nav>
</header>
