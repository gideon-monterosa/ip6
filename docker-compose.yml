services:
  postgres:
    image: postgres:16-alpine
    container_name: ip6-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meetingdb
      POSTGRES_USER: meetinguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinguser -d meetingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ip6-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: meetinguser
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://meetings.isenegger.dev,https://meetings.isenegger.dev
      APP_FRONTEND_URL: https://meetings.isenegger.dev
      GOOGLE_REDIRECT_URI: https://meetings.isenegger.dev/calendar-callback
      MICROSOFT_REDIRECT_URI: https://meetings.isenegger.dev/calendar-callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_FREE_BUSY_CLIENT_ID: ${GOOGLE_FREE_BUSY_CLIENT_ID}
      GOOGLE_FREE_BUSY_CLIENT_SECRET: ${GOOGLE_FREE_BUSY_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./backend/firebase.json:/app/firebase.json:ro
    networks:
      - meeting-network
    restart: always

  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://postgres:5432/meetingdb -user=meetinguser -password=${POSTGRES_PASSWORD:-meetingpass} -connectRetries=60 migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meeting-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
        FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY}
    container_name: ip6-frontend
    networks:
      - meeting-network
    restart: always

  proxy:
    image: nginx:stable-alpine
    container_name: ip6-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - meeting-network
    restart: always

  certbot:
    image: certbot/certbot
    container_name: ip6-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
  certbot_conf:
  certbot_www:

networks:
  meeting-network:
    driver: bridge
