version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ip6-postgres
    environment:
      POSTGRES_DB: meetingdb
      POSTGRES_USER: meetinguser
      POSTGRES_PASSWORD: meetingpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinguser -d meetingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meeting-network

volumes:
  postgres_data:
    driver: local

networks:
  meeting-network:
    driver: bridge
