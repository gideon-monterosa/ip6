services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      APP_FRONTEND_URL: http://localhost:4200
      GOOGLE_REDIRECT_URI: http://localhost:4200/calendar-callback
      MICROSOFT_REDIRECT_URI: http://localhost:4200/calendar-callback
      SPRING_FLYWAY_ENABLED: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
    entrypoint: ["mvn", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    entrypoint: ["npm", "start", "--", "--host", "0.0.0.0", "--poll", "2000"]

  proxy:
    ports:
      - "80:80"

volumes:
  maven-cache:
    driver: local
